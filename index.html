:root{
  --bg-page:#eaf3fc;
  --bg-page-2:#f4f9fd;
  --card-white:#ffffff;

  --primary-deep:#1e4d8c;

  overflow-x:hidden;
  position:relative;

  font-weight:700;
}
.mono{font-family:'JetBrains Mono',monospace;}

input,textarea{font-family:inherit;}

/* ---------- splash screen ---------- */
#splash-screen{
  position:fixed; inset:0; z-index:100;
  background:#0d1526;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  transition:opacity .4s ease;
}
#splash-screen img{
  width:100%; height:100%; object-fit:cover; display:block;
}
#splash-screen.fade-out{opacity:0; pointer-events:none;}

html, body{ overscroll-behavior-y:contain; }

/* ---------- crop tool ---------- */
.crop-viewport{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  border-radius:14px;
  overflow:hidden;
  background:#0d1526;
  touch-action:none;
  user-select:none;
}
.crop-viewport img{
  position:absolute;
  top:50%; left:50%;
  transform-origin:center center;
  max-width:none;
  pointer-events:none;
}

/* ================= LOGIN SCREEN ================= */
#login-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
  padding:24px;
  text-align:center;
  overflow:hidden;
}
#login-screen .login-card{
  position:relative;
  z-index:1;
  background:var(--card-white);
  border-radius:26px;
  padding:38px 28px 32px;
  box-shadow:var(--shadow-pop);
  max-width:340px;
  width:100%;
}
#login-screen .mascot{
  width:96px; height:96px;
  border-radius:50%;
  object-fit:cover;
  object-position:50% 15%;
  margin:0 auto 16px;
  display:block;
  border:4px solid var(--chip);
  box-shadow:var(--shadow-card);
}
.eyebrow-ticket{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--chip);
  color:var(--primary-deep);
  padding:5px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:.06em;
  font-weight:700;
}
#login-screen h1{
  font-size:32px;
  line-height:1.1;
  margin:14px 0 4px;
  color:var(--primary-deep);
}
#login-screen h1 span{color:var(--gold);}
#login-screen p.tagline{
  color:var(--text-dim);
  font-size:14px;
  margin:0 0 24px;
  line-height:1.5;
}
.btn-google{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--primary-deep);
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:14px;
  font-weight:800;
  font-size:15px;
  box-shadow:var(--shadow-card);
  transition:transform .15s ease;
}
.btn-google:active{transform:scale(.96);}
.btn-google svg{width:20px;height:20px;background:#fff;border-radius:4px;padding:2px;}
#login-screen .subnote{
  margin-top:14px;
  font-size:12px;
  color:var(--text-dim);
}

/* ================= APP SHELL ================= */
#app-screen{display:none; min-height:100vh; flex-direction:column; position:relative; z-index:1;}
#app-screen.active{display:flex;}
#login-screen.hidden{display:none;}

.topbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:20;
  background:var(--bg-page-2);
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border-soft);
}
.topbar-row{
  display:flex; align-items:center; gap:10px;
  margin-bottom:12px;
}
.search-wrap{position:relative; flex:1;}
.search-wrap input{
  width:100%;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-main);
  padding:12px 14px 12px 40px;
  border-radius:14px;
  font-size:14px;
  outline:none;
  box-shadow:var(--shadow-card);
}
.search-wrap input:focus{border-color:var(--primary);}
.search-wrap input::placeholder{color:var(--text-dim);}
.search-wrap .icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-dim); font-size:15px; pointer-events:none;
}
.user-chip{
  display:flex; align-items:center; gap:6px;
  background:var(--card-white);
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-card);
  flex-shrink:0;
}
.user-chip img{width:24px;height:24px;border-radius:50%; display:block;}
.user-chip button{
  background:none;border:none;color:var(--primary-deep);font-size:12px;
  font-weight:800;
}

.view-toggle{
  display:flex; gap:8px;
}
.view-toggle button{
  flex:1;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-dim);
  padding:9px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
}
.view-toggle button.active{
  background:var(--primary-deep);
  color:#fff;
  border-color:var(--primary-deep);
  box-shadow:var(--shadow-card);
}

main{flex:1; padding:calc(var(--topbar-h, 138px) + 14px) 16px 110px;}

/* ---------- pull to refresh ---------- */
.pull-refresh{
  position:fixed;
  top:var(--topbar-h, 138px);
  left:0; right:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  height:0;
  overflow:hidden;
  opacity:0;
  color:var(--primary-deep);
  font-size:12.5px;
  font-weight:700;
  background:var(--bg-page-2);
  transition:opacity .15s ease;
}
.pull-refresh.dragging{transition:none;}
.pull-refresh.visible{opacity:1;}
.pull-refresh-spinner{
  width:16px;height:16px;border-radius:50%;
  border:2.5px solid var(--chip);
  border-top-color:var(--primary-deep);
  transition:transform .15s ease;
}
.pull-refresh.refreshing .pull-refresh-spinner{
  animation:spin 0.7s linear infinite;
}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--text-dim);
}
.empty-state .emoji{font-size:44px; display:block; margin-bottom:10px;}
.empty-state h3{color:var(--primary-deep); font-size:24px; margin:0 0 6px;}

/* ---------- GRID VIEW: 2x2 big poster squares per the sketch ---------- */
.grid-view{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:14px;
}
.ticket-card{
  background:var(--card-white);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow-card);
  position:relative;
  border:1px solid var(--border-soft);
  transition:transform .15s ease;
}
.ticket-card:active{transform:scale(.97);}
.ticket-card .poster{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.ticket-card .poster-fallback{
  width:100%; aspect-ratio:3/4;
  display:flex; align-items:center; justify-content:center;
  font-size:34px;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.ticket-card .info{
  padding:10px 11px 13px;
}
.ticket-card .movie-title{
  font-size:15.5px;
  font-weight:700;
  color:var(--text-main);
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ticket-card .movie-date{
  display:inline-block;
  font-size:11px;
  color:var(--primary-deep);
  background:var(--chip);
  padding:2px 8px;
  border-radius:999px;
  margin-top:6px;
  letter-spacing:.02em;
}

/* ---------- LIST / OVERVIEW VIEW ---------- */
.list-view{display:flex; flex-direction:column; gap:10px;}
.list-row{
  display:flex; align-items:center; gap:12px;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:11px 14px;
  box-shadow:var(--shadow-card);
}
.list-row .thumb{
  width:42px;height:58px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.list-row .thumb-fallback{
  width:42px;height:58px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.list-row .meta{flex:1; min-width:0;}
.list-row .meta .t{
  font-size:15.5px; font-weight:700; color:var(--text-main);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-row .meta .d{
  font-size:11.5px; color:var(--primary); margin-top:3px; font-weight:600;
}
.list-row .chev{color:var(--text-dim); font-size:16px;}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:20px; bottom:26px; z-index:30;
  width:58px;height:58px;border-radius:50%;
  background:var(--primary-deep);
  color:#fff;
  border:none;
  font-size:28px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(30,77,140,.4);
}
.fab:active{transform:scale(.92);}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(28,43,58,.4);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  background:var(--bg-page-2);
  width:100%;
  max-width:440px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:22px;
  padding:20px 18px 24px;
  box-shadow:0 20px 50px rgba(28,43,58,.35);
  animation:popin .18s ease;
}
@keyframes popin{from{transform:scale(.94);opacity:0;} to{transform:scale(1);opacity:1;}}
.modal-handle{display:none;}
.modal-sheet h2{font-size:22px; color:var(--primary-deep); margin:0 0 14px;}

.field{margin-bottom:14px;}
.field label{
  display:block; font-size:12px; color:var(--text-dim);
  letter-spacing:.02em; margin-bottom:6px; font-weight:700;
}
.field input[type=text], .field input[type=date], .field textarea{
  width:100%;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-main);
  padding:11px 12px;
  border-radius:12px;
  font-size:15px;
  outline:none;
}
.field input:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{min-height:110px; resize:vertical; line-height:1.5;}

.photo-upload-row{
  display:flex; gap:8px; flex-wrap:wrap;
}
.photo-thumb{
  position:relative; width:72px;height:72px;border-radius:12px;overflow:hidden;
  border:1px solid var(--border-soft);
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{
  position:absolute; top:2px; right:2px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(28,43,58,.6); color:#fff; border:none;
  font-size:11px; display:flex; align-items:center; justify-content:center;
}
.add-photo-btn{
  width:72px;height:72px;border-radius:12px;
  border:1.5px dashed #b7cde6;
  background:var(--card-white);
  color:var(--primary);
  font-size:24px;
  display:flex; align-items:center; justify-content:center;
}

.modal-actions{
  display:flex; gap:10px; margin-top:6px;
}
.btn{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:none;
  font-weight:800;
  font-size:14px;
  letter-spacing:.01em;
}
.btn-primary{background:var(--primary-deep); color:#fff;}
.btn-ghost{background:var(--card-white); color:var(--text-main); border:1px solid var(--border-soft);}
.btn-danger{background:#fdeeee; color:#c0392b; border:1px solid #f6d2d2;}
.btn:disabled{opacity:.5;}
.btn:active{transform:scale(.97);}

/* ---------- DETAIL MODAL ---------- */
#detail-modal .detail-header{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;
}
#detail-modal h2{margin-bottom:2px; padding-right:8px;}
.detail-header-actions{
  display:flex; gap:8px; flex-shrink:0;
}
#detail-modal .icon-btn{
  background:var(--card-white); border:1px solid var(--border-soft); color:var(--text-main);
  width:32px;height:32px;border-radius:50%; font-size:15px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
#detail-modal .icon-btn.edit-btn{color:var(--primary-deep);}
#detail-modal .close-x{
  background:var(--card-white); border:1px solid var(--border-soft); color:var(--text-main);
  width:32px;height:32px;border-radius:50%; font-size:16px; flex-shrink:0;
}
.detail-date{
  display:inline-block;
  color:var(--primary-deep); background:var(--chip);
  font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px;
  margin-bottom:14px;
}
.detail-owner{
  display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); margin-bottom:14px;
}
.detail-owner img{width:20px;height:20px;border-radius:50%;}
.detail-photos{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;
}
.detail-photos img{
  width:120px; height:160px; object-fit:cover; border-radius:12px; flex-shrink:0;
  border:1px solid var(--border-soft);
}
.review-entry{
  position:relative;
  border:1.5px solid #b9d3ef;
  border-radius:18px 21px 16px 23px / 20px 15px 23px 14px;
  padding:18px 18px 16px;
  margin:18px 3px 22px;
  transform:rotate(-0.25deg);
}
.review-entry:first-child{margin-top:6px;}
.review-entry.empty{
  color:var(--text-dim); font-style:italic;
  border-style:dashed;
}
.review-entry .corner-mark{
  position:absolute;
  color:var(--primary);
  font-size:15px;
  line-height:1;
  background:var(--bg-page-2);
  padding:0 3px;
}
.review-entry .corner-tl{top:-9px; left:16px;}
.review-entry .corner-br{bottom:-9px; right:16px;}
.review-entry-head{
  display:flex; align-items:center; gap:7px;
  font-size:12.5px; font-weight:700; color:var(--primary-deep);
  margin-bottom:6px;
}
.review-entry-head img{
  width:22px; height:22px; border-radius:50%; object-fit:cover;
  background:var(--chip);
}
.review-entry-text{
  font-family:'Iansui','XiaoLai','ChenYuLuoYan','LXGW WenKai TC','Setofont','Baloo 2',sans-serif;
  font-size:16.5px;
  line-height:1.9;
  color:var(--text-main);
  white-space:pre-wrap;
}
#detail-review{margin-bottom:10px;}

.loading-overlay{
  position:fixed; inset:0; z-index:80;
  background:rgba(234,243,252,.92);
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;
}
.loading-overlay.active{display:flex;}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--chip);
  border-top-color:var(--primary-deep);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-overlay p{color:var(--primary-deep); font-size:13px; font-weight:700;}

.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:var(--primary-deep); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700;
  box-shadow:var(--shadow-pop);
  z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

@media (min-width:520px){
  .grid-view{grid-template-columns:repeat(3,1fr);}
}


/* date input: fix iOS/Android layout shifting ("格子跑掉") by dropping native chrome styling */
input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  min-width:0;
}

/* rating chips (觀後感覺) in the edit form */
.rating-row{display:flex; gap:8px; flex-wrap:wrap;}
.rating-chip{
  flex:1; min-width:84px;
  background:var(--card-white); border:1px solid var(--border-soft); color:var(--text-dim);
  padding:9px 10px; border-radius:12px; font-size:13px; font-weight:700;
}
.rating-chip.active{
  background:var(--primary-deep); color:#fff; border-color:var(--primary-deep);
}

/* rating pill shown next to the date, in detail (view) mode only */
.detail-date-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.detail-date-row .detail-date{margin-bottom:0;}
.detail-rating-chip{
  display:inline-block;
  color:var(--primary-deep); background:var(--chip);
  font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px;
}

/* star rating (per-person): 很可以=filled, 還行啦=half, 先不要=outline, all in #FFFFCC */
.star-icon{
  color:#FFFFCC;
  filter:drop-shadow(0 0 1px rgba(0,0,0,.35));
}
.rating-chip{display:inline-flex; align-items:center; justify-content:center; gap:5px;}
.rating-chip .star-icon{font-size:14px;}

.review-entry-head .star-icon{margin-left:auto; font-size:15px;}
.review-entry-text.empty{color:var(--text-dim); font-style:italic;}

.card-rating-row{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 2px;}
.card-rating-pair{display:inline-flex; align-items:center; gap:3px;}
.card-rating-pair img{width:16px; height:16px; border-radius:50%; object-fit:cover; flex-shrink:0;}
.card-rating-pair .star-icon{font-size:13px;}
</style>
</head>

<script type="module">
// ⚠️ 把下面換成你自己 Firebase 專案的設定值
// 位置：Firebase Console → 專案設定 → 一般 → 你的應用程式 → SDK 設定和設定
const firebaseConfig = {
  apiKey: "AIzaSyAGh7CmE_CYTWL4OvCgv9cymiv_3fSjDv0",
  authDomain: "movie-diary-ae06a.firebaseapp.com",
  projectId: "movie-diary-ae06a",
  storageBucket: "movie-diary-ae06a.firebasestorage.app",
  messagingSenderId: "402874180425",
  appId: "1:402874180425:web:48dd5186b0e1cf4f8bb098"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, deleteField,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ---------- state ----------
let currentUser = null;
let allMovies = [];      // raw docs from firestore
let currentView = "grid"; // grid | list
let searchTerm = "";
let pendingPhotos = [];   // {file, dataUrl} for the add/edit form (new uploads, stored as base64 in Firestore)
let existingPhotos = [];  // base64 strings already saved (when editing)
let editingId = null;     // movie doc id being edited, null = new
let profileMap = {};      // uid -> { nickname, avatarUrl }
let pendingAvatarDataUrl = null; // newly picked avatar in the profile modal, before save

// ---------- dom refs ----------
const $ = (sel) => document.querySelector(sel);
const loginScreen = $("#login-screen");
const appScreen = $("#app-screen");
const userChip = $("#user-chip");
const contentEl = $("#content");
const searchInput = $("#search-input");
const loadingOverlay = $("#loading-overlay");
const toastEl = $("#toast");

// ================= AUTH =================
$("#google-signin-btn").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    showToast("登入失敗，請再試一次");
    console.error(e);
  }
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const proceed = () => {
    if (user) {
      loginScreen.classList.add("hidden");
      appScreen.classList.add("active");
      listenToProfiles();
      listenToMovies();
      requestAnimationFrame(updateTopbarHeight);
    } else {
      loginScreen.classList.remove("hidden");
      appScreen.classList.remove("active");
    }
    hideSplash();
  };
  const elapsed = Date.now() - splashStart;
  const MIN_SPLASH = 500;
  if (elapsed < MIN_SPLASH) setTimeout(proceed, MIN_SPLASH - elapsed);
  else proceed();
});

// ================= SPLASH SCREEN =================
const splashStart = Date.now();
let splashHidden = false;
function hideSplash() {
  if (splashHidden) return;
  splashHidden = true;
  const el = $("#splash-screen");
  el.classList.add("fade-out");
  setTimeout(() => { el.style.display = "none"; }, 450);
}

// ================= TOPBAR HEIGHT (for fixed header spacing) =================
function updateTopbarHeight() {
  const tb = $("#topbar");
  if (tb && tb.offsetHeight) {
    document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
  }
}
window.addEventListener("resize", updateTopbarHeight);

// ================= PULL TO REFRESH =================
const pullRefreshEl = $("#pull-refresh");
const pullRefreshLabel = $("#pull-refresh-label");
const PULL_THRESHOLD = 68;
let pullStartY = null;
let pulling = false;

function isAtTop() { return window.scrollY <= 0; }

window.addEventListener("touchstart", (e) => {
  if (!appScreen.classList.contains("active")) return;
  if (!isAtTop()) { pullStartY = null; return; }
  pullStartY = e.touches[0].clientY;
  pulling = false;
}, { passive: true });

window.addEventListener("touchmove", (e) => {
  if (pullStartY === null) return;
  const dy = e.touches[0].clientY - pullStartY;
  if (dy > 0 && isAtTop()) {
    pulling = true;
    const dist = Math.min(dy * 0.5, 90);
    pullRefreshEl.classList.add("visible", "dragging");
    pullRefreshEl.style.height = dist + "px";
    pullRefreshEl.querySelector(".pull-refresh-spinner").style.transform = `rotate(${dist * 3}deg)`;
    pullRefreshLabel.textContent = dist > PULL_THRESHOLD ? "放開重新整理" : "下拉重新整理";
  }
}, { passive: true });

window.addEventListener("touchend", () => {
  if (!pulling) { pullStartY = null; return; }
  const currentHeight = parseFloat(pullRefreshEl.style.height || "0");
  pullRefreshEl.classList.remove("dragging");
  if (currentHeight > PULL_THRESHOLD) {
    doPullRefresh();
  } else {
    pullRefreshEl.style.height = "0px";
    pullRefreshEl.classList.remove("visible");
  }
  pullStartY = null;
  pulling = false;
});

function doPullRefresh() {
  pullRefreshEl.classList.add("refreshing");
  pullRefreshLabel.textContent = "更新中…";
  pullRefreshEl.style.height = "48px";
  setTimeout(() => {
    render();
    pullRefreshEl.classList.remove("refreshing", "visible");
    pullRefreshEl.style.height = "0px";
    showToast("已是最新資料");
  }, 600);
}

function myProfile() {
  return profileMap[currentUser.uid] || {};
}
function displayNameFor(uid) {
  const p = profileMap[uid];
  if (p && p.nickname) return p.nickname;
  if (uid === (currentUser && currentUser.uid) && currentUser.displayName) return currentUser.displayName;
  return "匿名影迷";
}
function displayAvatarFor(uid) {
  const p = profileMap[uid];
  if (p && p.avatarUrl) return p.avatarUrl;
  if (uid === (currentUser && currentUser.uid) && currentUser.photoURL) return currentUser.photoURL;
  return "";
}

function renderUserChip() {
  const name = displayNameFor(currentUser.uid);
  const avatar = displayAvatarFor(currentUser.uid);
  userChip.innerHTML = `
    <img id="my-avatar-btn" src="${avatar}" alt="" style="cursor:pointer;" title="編輯個人資料">
    <button id="signout-btn2">登出</button>
  `;
  userChip.querySelector("#my-avatar-btn").addEventListener("click", openProfileModal);
  userChip.querySelector("#signout-btn2").addEventListener("click", () => signOut(auth));
}

// ================= PROFILES (custom nickname / avatar) =================
function listenToProfiles() {
  onSnapshot(collection(db, "profiles"), (snap) => {
    profileMap = {};
    snap.docs.forEach(d => { profileMap[d.id] = d.data(); });
    ensureMyProfileExists();
    renderUserChip();
    render(); // re-render movie cards/list so owner tags pick up new nicknames
  }, (err) => console.error(err));
}

// 第一次登入時，自動把 Google 的名字/頭像存成大家都看得到的預設值，
// 這樣別人不會看到「匿名影迷」，除非本人自己想維持匿名。
let myProfileEnsured = false;
async function ensureMyProfileExists() {
  if (myProfileEnsured) return;
  if (profileMap[currentUser.uid]) { myProfileEnsured = true; return; }
  myProfileEnsured = true;
  try {
    await setDoc(doc(db, "profiles", currentUser.uid), {
      nickname: currentUser.displayName || "匿名影迷",
      avatarUrl: currentUser.photoURL || "",
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch (e) {
    console.error(e);
  }
}

const profileModal = $("#profile-modal");
const profileNicknameInput = $("#profile-nickname-input");
const profileAvatarImg = $("#profile-avatar-img");
const profileAvatarInput = $("#profile-avatar-input");

function openProfileModal() {
  pendingAvatarDataUrl = null;
  const p = myProfile();
  profileNicknameInput.value = p.nickname || currentUser.displayName || "";
  profileAvatarImg.src = displayAvatarFor(currentUser.uid) || "";
  profileModal.classList.add("active");
}
$("#profile-cancel-btn").addEventListener("click", () => profileModal.classList.remove("active"));
$("#profile-close-x").addEventListener("click", () => profileModal.classList.remove("active"));
$("#profile-avatar-preview").addEventListener("click", () => profileAvatarInput.click());
profileAvatarInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingAvatarDataUrl = await resizeImageToDataUrl(file, 240, 0.8);
    profileAvatarImg.src = pendingAvatarDataUrl;
  } catch (err) {
    console.error(err);
    showToast("頭像處理失敗");
  }
  profileAvatarInput.value = "";
});
$("#profile-save-btn").addEventListener("click", async () => {
  const nickname = profileNicknameInput.value.trim() || "匿名影迷";
  const data = { nickname, updatedAt: serverTimestamp() };
  if (pendingAvatarDataUrl) data.avatarUrl = pendingAvatarDataUrl;
  else if (myProfile().avatarUrl) data.avatarUrl = myProfile().avatarUrl;

  setLoading(true, "儲存中…");
  try {
    await setDoc(doc(db, "profiles", currentUser.uid), data, { merge: true });
    setLoading(false);
    profileModal.classList.remove("active");
    showToast("已更新個人資料！");
  } catch (e) {
    console.error(e);
    setLoading(false);
    showToast("儲存失敗，請確認 Firebase 設定");
  }
});

// ================= FIRESTORE LISTENER =================
function listenToMovies() {
  const q = query(collection(db, "movies"), orderBy("watchDate", "desc"));
  onSnapshot(q, (snap) => {
    allMovies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => {
    console.error(err);
    showToast("讀取資料失敗，請檢查 Firestore 設定");
  });
}

// ================= VIEW TOGGLE =================
$("#view-grid-btn").addEventListener("click", () => setView("grid"));
$("#view-list-btn").addEventListener("click", () => setView("list"));
function setView(v) {
  currentView = v;
  $("#view-grid-btn").classList.toggle("active", v === "grid");
  $("#view-list-btn").classList.toggle("active", v === "list");
  render();
}

// ================= SEARCH =================
searchInput.addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// ================= RENDER =================
function getFiltered() {
  let list = allMovies;
  if (searchTerm) {
    list = list.filter(m =>
      (m.title || "").toLowerCase().includes(searchTerm) ||
      (m.review || "").toLowerCase().includes(searchTerm)
    );
  }
  return list;
}

function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, "0")}.${String(dt.getDate()).padStart(2, "0")}`;
}

function render() {
  const movies = getFiltered();

  if (movies.length === 0) {
    contentEl.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🍿</span>
        <h3>${searchTerm ? "找不到這部電影" : "還沒有任何紀錄"}</h3>
        <p>${searchTerm ? "換個關鍵字試試看" : "點右下角的 ＋ 新增第一筆觀影紀錄"}</p>
      </div>`;
    return;
  }

  if (currentView === "grid") {
    contentEl.innerHTML = `<div class="grid-view">${movies.map(cardHtml).join("")}</div>`;
  } else {
    contentEl.innerHTML = `<div class="list-view">${movies.map(rowHtml).join("")}</div>`;
  }

  contentEl.querySelectorAll("[data-open-id]").forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.openId));
  });

  requestAnimationFrame(autoFitTitles);
}

function autoFitTitles() {
  contentEl.querySelectorAll(".movie-title, .list-row .meta .t").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    const minSize = 11;
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && size > minSize && guard < 30) {
      size -= 0.5;
      el.style.fontSize = size + "px";
      guard++;
    }
  });
}

const RATING_ICON = { "很可以": "bi-star-fill", "還行啦": "bi-star-half", "先不要": "bi-star" };
function ratingIconHtml(rating) {
  const cls = RATING_ICON[rating];
  return cls ? `<i class="bi ${cls} star-icon"></i>` : "";
}
function ratingsOf(m) {
  return m.ratings || (m.rating ? { [m.createdBy]: m.rating } : {});
}
function cardRatingRowHtml(m) {
  const ratings = ratingsOf(m);
  const uids = Object.keys(ratings);
  if (!uids.length) return "";
  return `<div class="card-rating-row">${uids.map(uid => `
    <span class="card-rating-pair"><img src="${displayAvatarFor(uid)}" alt="">${ratingIconHtml(ratings[uid])}</span>
  `).join("")}</div>`;
}

function cardHtml(m) {
  const cover = (m.photos && m.photos[0])
    ? `<img class="poster" src="${m.photos[0]}" loading="lazy" alt="${escapeHtml(m.title)}">`
    : `<div class="poster-fallback">🎬</div>`;
  return `
    <div class="ticket-card" data-open-id="${m.id}">
      ${cover}
      <div class="info">
        <div class="movie-title">${escapeHtml(m.title)}</div>
        ${cardRatingRowHtml(m)}
        <div class="movie-date mono">${formatDate(m.watchDate)}</div>
      </div>
    </div>`;
}

function rowHtml(m) {
  const thumb = (m.photos && m.photos[0])
    ? `<img class="thumb" src="${m.photos[0]}" loading="lazy" alt="">`
    : `<div class="thumb-fallback">🎬</div>`;
  return `
    <div class="list-row" data-open-id="${m.id}">
      ${thumb}
      <div class="meta">
        <div class="t">${escapeHtml(m.title)}</div>
        <div class="d mono">${formatDate(m.watchDate)}</div>
      </div>
      <div class="chev">›</div>
    </div>`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ================= ADD / EDIT MODAL =================
const formModal = $("#form-modal");
const formTitle = $("#form-title-text");
const titleInput = $("#input-title");
const dateInput = $("#input-date");
const reviewInput = $("#input-review");
const ratingRow = $("#rating-row");
let selectedRating = null;
function renderRatingRow() {
  ratingRow.querySelectorAll(".rating-chip").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.rating === selectedRating);
  });
}
ratingRow.addEventListener("click", (e) => {
  const btn = e.target.closest(".rating-chip");
  if (!btn) return;
  selectedRating = (selectedRating === btn.dataset.rating) ? null : btn.dataset.rating;
  renderRatingRow();
});
const photoRow = $("#photo-upload-row");
const fileInput = $("#file-input");
const deleteBtn = $("#delete-btn");

$("#fab-add").addEventListener("click", () => openForm());
$("#form-cancel-btn").addEventListener("click", closeForm);

function getMyReviewText(movie) {
  if (movie.reviews && movie.reviews[currentUser.uid]) return movie.reviews[currentUser.uid].text || "";
  if (movie.review && movie.createdBy === currentUser.uid) return movie.review; // legacy single-review docs
  return "";
}
function getMyRating(movie) {
  if (movie.ratings && movie.ratings[currentUser.uid]) return movie.ratings[currentUser.uid];
  if (movie.rating && movie.createdBy === currentUser.uid) return movie.rating; // legacy single-rating docs
  return null;
}

function openForm(movie = null) {
  editingId = movie ? movie.id : null;
  formTitle.textContent = movie ? "編輯紀錄" : "新增觀影紀錄";
  titleInput.value = movie ? movie.title : "";
  dateInput.value = movie ? movie.watchDate : new Date().toISOString().slice(0, 10);
  selectedRating = movie ? getMyRating(movie) : null;
  renderRatingRow();
  reviewInput.value = movie ? getMyReviewText(movie) : "";
  existingPhotos = movie ? [...(movie.photos || [])] : [];
  pendingPhotos = [];
  deleteBtn.style.display = movie ? "block" : "none";
  renderPhotoRow();
  formModal.classList.add("active");
}
function closeForm() {
  formModal.classList.remove("active");
  pendingPhotos = [];
}

function renderPhotoRow() {
  const existingHtml = existingPhotos.map((url, i) => `
    <div class="photo-thumb"><img src="${url}"><button class="rm" data-existing="${i}">✕</button></div>
  `).join("");
  const pendingHtml = pendingPhotos.map((p, i) => `
    <div class="photo-thumb"><img src="${p.dataUrl}"><button class="rm" data-pending="${i}">✕</button></div>
  `).join("");
  photoRow.innerHTML = existingHtml + pendingHtml + `<button type="button" class="add-photo-btn" id="add-photo-trigger">＋</button>`;

  $("#add-photo-trigger").addEventListener("click", () => fileInput.click());
  photoRow.querySelectorAll("[data-existing]").forEach(b => {
    b.addEventListener("click", () => {
      existingPhotos.splice(Number(b.dataset.existing), 1);
      renderPhotoRow();
    });
  });
  photoRow.querySelectorAll("[data-pending]").forEach(b => {
    b.addEventListener("click", () => {
      pendingPhotos.splice(Number(b.dataset.pending), 1);
      renderPhotoRow();
    });
  });
}

// resize + compress image client-side, output as a base64 data URL
// (stored directly inside the Firestore document, no separate storage bucket needed)
function resizeImageToDataUrl(file, maxEdge = 900, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxEdge || height > maxEdge) {
        if (width > height) { height = Math.round(height * maxEdge / width); width = maxEdge; }
        else { width = Math.round(width * maxEdge / height); height = maxEdge; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

fileInput.addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = "";
  if (files.length === 0) return;
  startCropQueue(files, (results) => {
    results.forEach(dataUrl => pendingPhotos.push({ dataUrl }));
    renderPhotoRow();
  });
});

// ================= PINCH-ZOOM CROP TOOL =================
const cropModal = $("#crop-modal");
const cropViewport = $("#crop-viewport");
const cropImg = $("#crop-img");
let cropQueue = [];
let cropAllResults = [];
let cropOnDone = null;
let cropState = null;

function startCropQueue(files, onDone) {
  cropQueue = files.slice();
  cropAllResults = [];
  cropOnDone = onDone;
  processNextCrop();
}

function processNextCrop() {
  if (cropQueue.length === 0) {
    const cb = cropOnDone;
    cropOnDone = null;
    if (cb) cb(cropAllResults);
    return;
  }
  const file = cropQueue.shift();
  const reader = new FileReader();
  reader.onload = (e) => {
    cropImg.onload = () => {
      cropModal.classList.add("active");
      requestAnimationFrame(() => { initCropState(); });
    };
    cropImg.src = e.target.result;
  };
  reader.onerror = () => { showToast("這張照片讀取失敗"); processNextCrop(); };
  reader.readAsDataURL(file);
}

function initCropState() {
  const vpRect = cropViewport.getBoundingClientRect();
  if (vpRect.width < 1 || vpRect.height < 1) {
    // viewport not laid out yet — try again next frame
    requestAnimationFrame(initCropState);
    return;
  }
  const nw = cropImg.naturalWidth, nh = cropImg.naturalHeight;
  const baseScale = Math.max(vpRect.width / nw, vpRect.height / nh);
  cropState = { nw, nh, vpW: vpRect.width, vpH: vpRect.height, baseScale, scale: 1, tx: 0, ty: 0 };
  applyCropTransform();
}

function clampCropTranslate() {
  const s = cropState;
  const totalScale = s.baseScale * s.scale;
  const dispW = s.nw * totalScale, dispH = s.nh * totalScale;
  const maxTx = Math.max(0, (dispW - s.vpW) / 2);
  const maxTy = Math.max(0, (dispH - s.vpH) / 2);
  s.tx = Math.max(-maxTx, Math.min(maxTx, s.tx));
  s.ty = Math.max(-maxTy, Math.min(maxTy, s.ty));
}

function applyCropTransform() {
  const s = cropState;
  clampCropTranslate();
  const totalScale = s.baseScale * s.scale;
  cropImg.style.width = s.nw + "px";
  cropImg.style.height = s.nh + "px";
  cropImg.style.transform = `translate(-50%,-50%) translate(${s.tx}px, ${s.ty}px) scale(${totalScale})`;
}

const cropPointers = new Map();
let cropPinchStartDist = null;
let cropPinchStartScale = 1;
let cropPanStart = null;

cropViewport.addEventListener("pointerdown", (e) => {
  cropViewport.setPointerCapture(e.pointerId);
  cropPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (cropPointers.size === 1) {
    cropPanStart = { x: e.clientX, y: e.clientY, tx: cropState.tx, ty: cropState.ty };
  } else if (cropPointers.size === 2) {
    const pts = [...cropPointers.values()];
    cropPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    cropPinchStartScale = cropState.scale;
  }
});
cropViewport.addEventListener("pointermove", (e) => {
  if (!cropPointers.has(e.pointerId) || !cropState) return;
  cropPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (cropPointers.size === 1 && cropPanStart) {
    cropState.tx = cropPanStart.tx + (e.clientX - cropPanStart.x);
    cropState.ty = cropPanStart.ty + (e.clientY - cropPanStart.y);
    applyCropTransform();
  } else if (cropPointers.size === 2 && cropPinchStartDist) {
    const pts = [...cropPointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    cropState.scale = Math.max(1, Math.min(4, cropPinchStartScale * (dist / cropPinchStartDist)));
    applyCropTransform();
  }
});
function endCropPointer(e) {
  cropPointers.delete(e.pointerId);
  if (cropPointers.size < 2) cropPinchStartDist = null;
  if (cropPointers.size === 0) cropPanStart = null;
  else if (cropPointers.size === 1 && cropState) {
    const [pt] = [...cropPointers.values()];
    cropPanStart = { x: pt.x, y: pt.y, tx: cropState.tx, ty: cropState.ty };
  }
}
cropViewport.addEventListener("pointerup", endCropPointer);
cropViewport.addEventListener("pointercancel", endCropPointer);
cropViewport.addEventListener("pointerleave", endCropPointer);
cropViewport.addEventListener("wheel", (e) => {
  if (!cropState) return;
  e.preventDefault();
  cropState.scale = Math.max(1, Math.min(4, cropState.scale - e.deltaY * 0.0012));
  applyCropTransform();
}, { passive: false });

function renderCropToDataUrl() {
  const s = cropState;
  const outW = 480, outH = 640;
  const canvas = document.createElement("canvas");
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext("2d");
  const ratio = outW / s.vpW;
  const totalScale = s.baseScale * s.scale;
  const dispW = s.nw * totalScale, dispH = s.nh * totalScale;
  const drawX = s.vpW / 2 - dispW / 2 + s.tx;
  const drawY = s.vpH / 2 - dispH / 2 + s.ty;
  ctx.drawImage(cropImg, drawX * ratio, drawY * ratio, dispW * ratio, dispH * ratio);
  return canvas.toDataURL("image/jpeg", 0.8);
}

$("#crop-confirm-btn").addEventListener("click", () => {
  cropAllResults.push(renderCropToDataUrl());
  cropModal.classList.remove("active");
  processNextCrop();
});
$("#crop-skip-btn").addEventListener("click", () => {
  cropModal.classList.remove("active");
  processNextCrop();
});
$("#crop-cancel-x").addEventListener("click", () => {
  cropQueue = [];
  cropModal.classList.remove("active");
  const cb = cropOnDone;
  cropOnDone = null;
  if (cb) cb(cropAllResults);
});

$("#form-save-btn").addEventListener("click", async () => {
  const title = titleInput.value.trim();
  const watchDate = dateInput.value;
  const review = reviewInput.value.trim();

  if (!title) { showToast("請輸入電影名稱"); return; }
  if (!watchDate) { showToast("請選擇觀看日期"); return; }

  const photos = [...existingPhotos, ...pendingPhotos.map(p => p.dataUrl)];
  // Firestore 單一文件上限 1MB，粗略檢查避免存太多大圖
  const approxSize = JSON.stringify(photos).length;
  if (approxSize > 850000) {
    showToast("照片太多或太大了，請刪掉幾張再試");
    return;
  }

  setLoading(true, "儲存中…");
  try {
    if (editingId) {
      const payload = { title, watchDate, photos };
      // 只更新「我自己」那份心得／評價，用 dot-path 寫入 map 欄位，不會動到別人寫的內容
      payload[`reviews.${currentUser.uid}`] = review
        ? { text: review, updatedAt: serverTimestamp() }
        : deleteField();
      payload[`ratings.${currentUser.uid}`] = selectedRating ? selectedRating : deleteField();
      await updateDoc(doc(db, "movies", editingId), payload);
    } else {
      await addDoc(collection(db, "movies"), {
        title, watchDate, photos,
        reviews: review ? { [currentUser.uid]: { text: review, updatedAt: serverTimestamp() } } : {},
        ratings: selectedRating ? { [currentUser.uid]: selectedRating } : {},
        createdBy: currentUser.uid,
        createdByName: currentUser.displayName || "",
        createdByPhoto: currentUser.photoURL || "",
        createdAt: serverTimestamp()
      });
    }
    setLoading(false);
    closeForm();
    showToast("已儲存！");
  } catch (e) {
    console.error(e);
    setLoading(false);
    showToast("儲存失敗，請確認 Firebase 設定");
  }
});

deleteBtn.addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("確定要刪除這筆觀影紀錄嗎？")) return;
  setLoading(true, "刪除中…");
  try {
    await deleteDoc(doc(db, "movies", editingId));
    setLoading(false);
    closeForm();
    closeDetail();
    showToast("已刪除");
  } catch (e) {
    console.error(e);
    setLoading(false);
    showToast("刪除失敗");
  }
});

// ================= DETAIL MODAL =================
const detailModal = $("#detail-modal");
$("#detail-close-x").addEventListener("click", closeDetail);

function getReviewEntries(m) {
  const entries = [];
  const seen = new Set();
  const ratings = ratingsOf(m);
  if (m.reviews) {
    Object.entries(m.reviews).forEach(([uid, r]) => {
      if (r && r.text) { entries.push({ uid, text: r.text, rating: ratings[uid] || null }); seen.add(uid); }
    });
  }
  // legacy fallback for movies saved before per-person reviews existed
  if (m.review && !(m.reviews && m.reviews[m.createdBy])) {
    entries.push({ uid: m.createdBy, text: m.review, rating: ratings[m.createdBy] || null });
    seen.add(m.createdBy);
  }
  // people who only left a rating without writing a review yet
  Object.keys(ratings).forEach(uid => {
    if (!seen.has(uid)) entries.push({ uid, text: "", rating: ratings[uid] });
  });
  return entries;
}

function openDetail(id) {
  const m = allMovies.find(x => x.id === id);
  if (!m) return;

  const ownerName = displayNameFor(m.createdBy);
  const ownerAvatar = displayAvatarFor(m.createdBy);

  $("#detail-title-text").textContent = m.title;
  $("#detail-date").textContent = formatDate(m.watchDate);
  const ratingEl = $("#detail-rating");
  if (m.rating) {
    ratingEl.textContent = m.rating;
    ratingEl.style.display = "inline-block";
  } else {
    ratingEl.textContent = "";
    ratingEl.style.display = "none";
  }
  $("#detail-owner").innerHTML = `<img src="${ownerAvatar}" alt=""> ${escapeHtml(ownerName)} 新增`;

  const photosHtml = (m.photos && m.photos.length)
    ? m.photos.map(u => `<img src="${u}" alt="">`).join("")
    : "";
  $("#detail-photos").innerHTML = photosHtml;
  $("#detail-photos").style.display = photosHtml ? "flex" : "none";

  const reviewEl = $("#detail-review");
  const entries = getReviewEntries(m);
  if (entries.length === 0) {
    reviewEl.innerHTML = `<div class="review-entry empty">還沒有人寫下心得。</div>`;
  } else {
    reviewEl.innerHTML = entries.map(({ uid, text, rating }) => `
      <div class="review-entry">
        <i class="bi bi-chevron-up corner-mark corner-tl"></i>
        <div class="review-entry-head">
          <img src="${displayAvatarFor(uid)}" alt="">
          <span>${escapeHtml(displayNameFor(uid))}</span>
          ${ratingIconHtml(rating)}
        </div>
        <div class="review-entry-text${text ? "" : " empty"}">${text ? escapeHtml(text) : "還沒有寫下文字心得"}</div>
        <i class="bi bi-chevron-down corner-mark corner-br"></i>
      </div>
    `).join("");
  }

  $("#detail-edit-btn").onclick = () => { closeDetail(); openForm(m); };

  detailModal.classList.add("active");
}
function closeDetail() {
  detailModal.classList.remove("active");
}

// ================= UTIL =================
function setLoading(on, msg = "處理中…") {
  loadingOverlay.classList.toggle("active", on);
  $("#loading-text").textContent = msg;
}
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

// ================= CLICK OUTSIDE TO CLOSE =================
function cancelCropQueue() {
  cropQueue = [];
  cropModal.classList.remove("active");
  const cb = cropOnDone;
  cropOnDone = null;
  if (cb) cb(cropAllResults);
}
const modalCloseHandlers = {
  "form-modal": closeForm,
  "detail-modal": closeDetail,
  "profile-modal": () => profileModal.classList.remove("active"),
  "crop-modal": cancelCropQueue
};
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", (e) => {
    if (e.target !== overlay) return; // only when clicking the backdrop itself, not the sheet
    const handler = modalCloseHandlers[overlay.id];
    if (handler) handler();
    else overlay.classList.remove("active");
  });
});

</script>
