<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#160c0d">
<title>片刻 · 觀影紀錄</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen">
  <div class="marquee">
    <span class="eyebrow-ticket">🎟️ ADMIT ONE</span>
    <h1>片刻<br><span>MOVIE DIARY</span></h1>
    <p class="tagline">紀錄每一次進場的時刻——海報、票根、還有看完當下的心情。</p>
    <button id="google-signin-btn" class="btn-google">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.1 3 9.2 7.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 36.4 26.9 37.5 24 37.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.1 40.4 16 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.9 35.9 45 30.4 45 24c0-1.4-.1-2.5-.4-3.5z"/></svg>
      使用 Google 登入
    </button>
    <div class="subnote">登入後即可開始紀錄，資料會同步到雲端</div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="film-icon">🎬</span><h2>片刻</h2></div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜尋電影名稱或心得…">
    </div>
    <div class="view-toggle">
      <button id="view-grid-btn" class="active">海報牆</button>
      <button id="view-list-btn">總覽</button>
    </div>
  </div>
  <div class="filmstrip"></div>

  <main>
    <div id="content"></div>
  </main>

  <button class="fab" id="fab-add">＋</button>
</div>

<!-- ============ ADD/EDIT FORM MODAL ============ -->
<div class="modal-overlay" id="form-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="detail-header">
      <h2 id="form-title-text">新增觀影紀錄</h2>
      <button class="close-x" id="form-close-x">✕</button>
    </div>

    <div class="field">
      <label>電影名稱</label>
      <input type="text" id="input-title" placeholder="例如：花樣年華">
    </div>
    <div class="field">
      <label>觀看日期</label>
      <input type="date" id="input-date">
    </div>
    <div class="field">
      <label>照片（海報、票根都可以）</label>
      <div class="photo-upload-row" id="photo-upload-row"></div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none">
    </div>
    <div class="field">
      <label>心得</label>
      <textarea id="input-review" placeholder="看完的想法、印象最深的一幕…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="form-cancel-btn">取消</button>
      <button class="btn btn-primary" id="form-save-btn">儲存</button>
    </div>
    <div class="modal-actions" style="margin-top:8px;">
      <button class="btn btn-danger" id="delete-btn" style="display:none;">刪除這筆紀錄</button>
    </div>
  </div>
</div>

<!-- ============ DETAIL MODAL ============ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="detail-header">
      <h2 id="detail-title-text"></h2>
      <button class="close-x" id="detail-close-x">✕</button>
    </div>
    <div class="detail-date mono" id="detail-date"></div>
    <div class="detail-owner" id="detail-owner"></div>
    <div class="detail-photos" id="detail-photos"></div>
    <div class="review-block" id="detail-review"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="detail-edit-btn">編輯這筆紀錄</button>
    </div>
  </div>
</div>

<!-- ============ LOADING / TOAST ============ -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">處理中…</p>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
