<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>片刻 · 觀影紀錄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --bg-page:#fff8f0;
  --bg-page-2:#fffdfa;
  --card-white:#ffffff;
  --primary:#e2572b;
  --primary-deep:#c2431c;
  --chip:#ffe8d6;
  --gold:#f4a941;
  --text-main:#3a2a20;
  --text-dim:#a3907e;
  --border-soft:#f2e4d6;
  --shadow-card: 0 6px 20px rgba(194,67,28,.09);
  --shadow-pop: 0 10px 28px rgba(194,67,28,.20);
  --radius: 18px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-page);
  color:var(--text-main);
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  position:relative;
}
h1,h2,h3,.display{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
::selection{background:var(--chip);color:var(--primary-deep);}

.dog-watermark{
  position:fixed;
  left:50%;
  bottom:-30px;
  transform:translateX(-50%);
  width:min(480px, 130vw);
  opacity:.06;
  filter:brightness(0) saturate(100%) invert(30%) sepia(60%) saturate(1200%) hue-rotate(340deg) brightness(95%) contrast(90%);
  pointer-events:none;
  z-index:0;
  user-select:none;
}

/* ================= LOGIN SCREEN ================= */
#login-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  background:linear-gradient(180deg, var(--bg-page-2) 0%, var(--bg-page) 100%);
  padding:24px;
  text-align:center;
  overflow:hidden;
}
#login-screen .login-card{
  position:relative;
  z-index:1;
  background:var(--card-white);
  border-radius:26px;
  padding:38px 28px 32px;
  box-shadow:var(--shadow-pop);
  max-width:340px;
  width:100%;
}
#login-screen .mascot{
  width:96px; height:96px;
  border-radius:50%;
  object-fit:cover;
  object-position:50% 15%;
  margin:0 auto 16px;
  display:block;
  border:4px solid var(--chip);
  box-shadow:var(--shadow-card);
}
.eyebrow-ticket{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--chip);
  color:var(--primary-deep);
  padding:5px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:.06em;
  font-weight:700;
}
#login-screen h1{
  font-size:32px;
  line-height:1.1;
  margin:14px 0 4px;
  color:var(--primary-deep);
}
#login-screen h1 span{color:var(--gold);}
#login-screen p.tagline{
  color:var(--text-dim);
  font-size:14px;
  margin:0 0 24px;
  line-height:1.5;
}
.btn-google{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--primary-deep);
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:14px;
  font-weight:800;
  font-size:15px;
  box-shadow:var(--shadow-card);
  transition:transform .15s ease;
}
.btn-google:active{transform:scale(.96);}
.btn-google svg{width:20px;height:20px;background:#fff;border-radius:4px;padding:2px;}
#login-screen .subnote{
  margin-top:14px;
  font-size:12px;
  color:var(--text-dim);
}

/* ================= APP SHELL ================= */
#app-screen{display:none; min-height:100vh; flex-direction:column; position:relative; z-index:1;}
#app-screen.active{display:flex;}
#login-screen.hidden{display:none;}

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg-page-2);
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border-soft);
}
.topbar-row{
  display:flex; align-items:center; gap:10px;
  margin-bottom:12px;
}
.search-wrap{position:relative; flex:1;}
.search-wrap input{
  width:100%;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-main);
  padding:12px 14px 12px 40px;
  border-radius:14px;
  font-size:14px;
  outline:none;
  box-shadow:var(--shadow-card);
}
.search-wrap input:focus{border-color:var(--primary);}
.search-wrap input::placeholder{color:var(--text-dim);}
.search-wrap .icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-dim); font-size:15px; pointer-events:none;
}
.user-chip{
  display:flex; align-items:center; gap:6px;
  background:var(--card-white);
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-card);
  flex-shrink:0;
}
.user-chip img{width:24px;height:24px;border-radius:50%; display:block;}
.user-chip button{
  background:none;border:none;color:var(--primary-deep);font-size:12px;
  font-weight:800;
}

.view-toggle{
  display:flex; gap:8px;
}
.view-toggle button{
  flex:1;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-dim);
  padding:9px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
}
.view-toggle button.active{
  background:var(--primary-deep);
  color:#fff;
  border-color:var(--primary-deep);
  box-shadow:var(--shadow-card);
}

main{flex:1; padding:16px 16px 110px;}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--text-dim);
}
.empty-state .emoji{font-size:44px; display:block; margin-bottom:10px;}
.empty-state h3{color:var(--primary-deep); font-size:24px; margin:0 0 6px;}

/* ---------- GRID VIEW: 2x2 big poster squares per the sketch ---------- */
.grid-view{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:14px;
}
.ticket-card{
  background:var(--card-white);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow-card);
  position:relative;
  border:1px solid var(--border-soft);
  transition:transform .15s ease;
}
.ticket-card:active{transform:scale(.97);}
.ticket-card .poster{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.ticket-card .poster-fallback{
  width:100%; aspect-ratio:3/4;
  display:flex; align-items:center; justify-content:center;
  font-size:34px;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.ticket-card .info{
  padding:10px 11px 13px;
}
.ticket-card .movie-title{
  font-size:15.5px;
  font-weight:700;
  color:var(--text-main);
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ticket-card .movie-date{
  display:inline-block;
  font-size:11px;
  color:var(--primary-deep);
  background:var(--chip);
  padding:2px 8px;
  border-radius:999px;
  margin-top:6px;
  letter-spacing:.02em;
}

/* ---------- LIST / OVERVIEW VIEW ---------- */
.list-view{display:flex; flex-direction:column; gap:10px;}
.list-row{
  display:flex; align-items:center; gap:12px;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:11px 14px;
  box-shadow:var(--shadow-card);
}
.list-row .thumb{
  width:42px;height:58px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.list-row .thumb-fallback{
  width:42px;height:58px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(135deg,var(--chip),var(--bg-page));
}
.list-row .meta{flex:1; min-width:0;}
.list-row .meta .t{
  font-size:15.5px; font-weight:700; color:var(--text-main);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-row .meta .d{
  font-size:11.5px; color:var(--primary); margin-top:3px; font-weight:600;
}
.list-row .chev{color:var(--text-dim); font-size:16px;}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:20px; bottom:26px; z-index:30;
  width:58px;height:58px;border-radius:50%;
  background:var(--primary-deep);
  color:#fff;
  border:none;
  font-size:28px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(194,67,28,.4);
}
.fab:active{transform:scale(.92);}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(58,42,32,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  background:var(--bg-page-2);
  width:100%;
  max-width:480px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:24px 24px 0 0;
  padding:18px 18px 28px;
  box-shadow:0 -10px 40px rgba(194,67,28,.22);
  animation:slideup .25s ease;
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.modal-handle{
  width:40px;height:4px;background:var(--border-soft);
  border-radius:99px; margin:0 auto 14px;
}
.modal-sheet h2{font-size:22px; color:var(--primary-deep); margin:0 0 14px;}

.field{margin-bottom:14px;}
.field label{
  display:block; font-size:12px; color:var(--text-dim);
  letter-spacing:.02em; margin-bottom:6px; font-weight:700;
}
.field input[type=text], .field input[type=date], .field textarea{
  width:100%;
  background:var(--card-white);
  border:1px solid var(--border-soft);
  color:var(--text-main);
  padding:11px 12px;
  border-radius:12px;
  font-size:15px;
  outline:none;
}
.field input:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{min-height:110px; resize:vertical; line-height:1.5;}

.photo-upload-row{
  display:flex; gap:8px; flex-wrap:wrap;
}
.photo-thumb{
  position:relative; width:72px;height:72px;border-radius:12px;overflow:hidden;
  border:1px solid var(--border-soft);
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{
  position:absolute; top:2px; right:2px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(58,42,32,.6); color:#fff; border:none;
  font-size:11px; display:flex; align-items:center; justify-content:center;
}
.add-photo-btn{
  width:72px;height:72px;border-radius:12px;
  border:1.5px dashed #e8c4a8;
  background:var(--card-white);
  color:var(--primary);
  font-size:24px;
  display:flex; align-items:center; justify-content:center;
}

.modal-actions{
  display:flex; gap:10px; margin-top:6px;
}
.btn{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:none;
  font-weight:800;
  font-size:14px;
  letter-spacing:.01em;
}
.btn-primary{background:var(--primary-deep); color:#fff;}
.btn-ghost{background:var(--card-white); color:var(--text-main); border:1px solid var(--border-soft);}
.btn-danger{background:#fdeeee; color:#c0392b; border:1px solid #f6d2d2;}
.btn:disabled{opacity:.5;}
.btn:active{transform:scale(.97);}

/* ---------- DETAIL MODAL ---------- */
#detail-modal .detail-header{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;
}
#detail-modal h2{margin-bottom:2px;}
#detail-modal .close-x{
  background:var(--card-white); border:1px solid var(--border-soft); color:var(--text-main);
  width:32px;height:32px;border-radius:50%; font-size:16px; flex-shrink:0;
}
.detail-date{
  display:inline-block;
  color:var(--primary-deep); background:var(--chip);
  font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px;
  margin-bottom:14px;
}
.detail-owner{
  display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); margin-bottom:14px;
}
.detail-owner img{width:20px;height:20px;border-radius:50%;}
.detail-photos{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;
}
.detail-photos img{
  width:120px; height:160px; object-fit:cover; border-radius:12px; flex-shrink:0;
  border:1px solid var(--border-soft);
}
.review-block{
  background:var(--card-white);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:14px;
  font-size:14.5px;
  line-height:1.65;
  color:var(--text-main);
  white-space:pre-wrap;
  margin-bottom:18px;
}
.review-block.empty{color:var(--text-dim); font-style:italic;}

.loading-overlay{
  position:fixed; inset:0; z-index:80;
  background:rgba(255,248,240,.92);
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;
}
.loading-overlay.active{display:flex;}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--chip);
  border-top-color:var(--primary-deep);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-overlay p{color:var(--primary-deep); font-size:13px; font-weight:700;}

.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:var(--primary-deep); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700;
  box-shadow:var(--shadow-pop);
  z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

@media (min-width:520px){
  .grid-view{grid-template-columns:repeat(3,1fr);}
}

</style>
</head>

      <label>照片（海報、票根都可以）</label>
      <div class="photo-upload-row" id="photo-upload-row"></div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none">
    </div>
    <div class="field">
      <label>心得</label>
      <textarea id="input-review" placeholder="看完的想法、印象最深的一幕…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="form-cancel-btn">取消</button>
      <button class="btn btn-primary" id="form-save-btn">儲存</button>
    </div>
    <div class="modal-actions" style="margin-top:8px;">
      <button class="btn btn-danger" id="delete-btn" style="display:none;">刪除這筆紀錄</button>
    </div>
  </div>
</div>

<!-- ============ DETAIL MODAL ============ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="detail-header">
      <h2 id="detail-title-text"></h2>
      <button class="close-x" id="detail-close-x">✕</button>
    </div>
    <div class="detail-date mono" id="detail-date"></div>
    <div class="detail-owner" id="detail-owner"></div>
    <div class="detail-photos" id="detail-photos"></div>
    <div class="review-block" id="detail-review"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="detail-edit-btn">編輯這筆紀錄</button>
    </div>
  </div>
</div>

<!-- ============ LOADING / TOAST ============ -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">處理中…</p>
</div>
<div class="toast" id="toast"></div>


<script type="module">
// ⚠️ 把下面換成你自己 Firebase 專案的設定值
// 位置：Firebase Console → 專案設定 → 一般 → 你的應用程式 → SDK 設定和設定
const firebaseConfig = {
  apiKey: "AIzaSyAGh7CmE_CYTWL4OvCgv9cymiv_3fSjDv0",
  authDomain: "movie-diary-ae06a.firebaseapp.com",
  projectId: "movie-diary-ae06a",
  storageBucket: "movie-diary-ae06a.firebasestorage.app",
  messagingSenderId: "402874180425",
  appId: "1:402874180425:web:48dd5186b0e1cf4f8bb098"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ---------- state ----------
let currentUser = null;
let allMovies = [];      // raw docs from firestore
let currentView = "grid"; // grid | list
let searchTerm = "";
let pendingPhotos = [];   // {file, dataUrl} for the add/edit form (new uploads, stored as base64 in Firestore)
let existingPhotos = [];  // base64 strings already saved (when editing)
let editingId = null;     // movie doc id being edited, null = new

// ---------- dom refs ----------
const $ = (sel) => document.querySelector(sel);
const loginScreen = $("#login-screen");
const appScreen = $("#app-screen");
const userChip = $("#user-chip");
const contentEl = $("#content");
const searchInput = $("#search-input");
const loadingOverlay = $("#loading-overlay");
const toastEl = $("#toast");

// ================= AUTH =================
$("#google-signin-btn").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    showToast("登入失敗，請再試一次");
    console.error(e);
  }
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    loginScreen.classList.add("hidden");
    appScreen.classList.add("active");
    renderUserChip();
    listenToMovies();
  } else {
    loginScreen.classList.remove("hidden");
    appScreen.classList.remove("active");
  }
});

function renderUserChip() {
  userChip.innerHTML = `
    <img src="${currentUser.photoURL || ''}" alt="">
    <button id="signout-btn2">登出</button>
  `;
  userChip.querySelector("#signout-btn2").addEventListener("click", () => signOut(auth));
}

// ================= FIRESTORE LISTENER =================
function listenToMovies() {
  const q = query(collection(db, "movies"), orderBy("watchDate", "desc"));
  onSnapshot(q, (snap) => {
    allMovies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => {
    console.error(err);
    showToast("讀取資料失敗，請檢查 Firestore 設定");
  });
}

// ================= VIEW TOGGLE =================
$("#view-grid-btn").addEventListener("click", () => setView("grid"));
$("#view-list-btn").addEventListener("click", () => setView("list"));
function setView(v) {
  currentView = v;
  $("#view-grid-btn").classList.toggle("active", v === "grid");
  $("#view-list-btn").classList.toggle("active", v === "list");
  render();
}

// ================= SEARCH =================
searchInput.addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// ================= RENDER =================
function getFiltered() {
  let list = allMovies;
  if (searchTerm) {
    list = list.filter(m =>
      (m.title || "").toLowerCase().includes(searchTerm) ||
      (m.review || "").toLowerCase().includes(searchTerm)
    );
  }
  return list;
}

function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, "0")}.${String(dt.getDate()).padStart(2, "0")}`;
}

function render() {
  const movies = getFiltered();

  if (movies.length === 0) {
    contentEl.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🍿</span>
        <h3>${searchTerm ? "找不到這部電影" : "還沒有任何紀錄"}</h3>
        <p>${searchTerm ? "換個關鍵字試試看" : "點右下角的 ＋ 新增第一筆觀影紀錄"}</p>
      </div>`;
    return;
  }

  if (currentView === "grid") {
    contentEl.innerHTML = `<div class="grid-view">${movies.map(cardHtml).join("")}</div>`;
  } else {
    contentEl.innerHTML = `<div class="list-view">${movies.map(rowHtml).join("")}</div>`;
  }

  contentEl.querySelectorAll("[data-open-id]").forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.openId));
  });
}

function cardHtml(m) {
  const cover = (m.photos && m.photos[0])
    ? `<img class="poster" src="${m.photos[0]}" loading="lazy" alt="${escapeHtml(m.title)}">`
    : `<div class="poster-fallback">🎬</div>`;
  return `
    <div class="ticket-card" data-open-id="${m.id}">
      ${cover}
      <div class="info">
        <div class="movie-title">${escapeHtml(m.title)}</div>
        <div class="movie-date mono">${formatDate(m.watchDate)}</div>
      </div>
    </div>`;
}

function rowHtml(m) {
  const thumb = (m.photos && m.photos[0])
    ? `<img class="thumb" src="${m.photos[0]}" loading="lazy" alt="">`
    : `<div class="thumb-fallback">🎬</div>`;
  return `
    <div class="list-row" data-open-id="${m.id}">
      ${thumb}
      <div class="meta">
        <div class="t">${escapeHtml(m.title)}</div>
        <div class="d mono">${formatDate(m.watchDate)}</div>
      </div>
      <div class="chev">›</div>
    </div>`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ================= ADD / EDIT MODAL =================
const formModal = $("#form-modal");
const formTitle = $("#form-title-text");
const titleInput = $("#input-title");
const dateInput = $("#input-date");
const reviewInput = $("#input-review");
const photoRow = $("#photo-upload-row");
const fileInput = $("#file-input");
const deleteBtn = $("#delete-btn");

$("#fab-add").addEventListener("click", () => openForm());
$("#form-cancel-btn").addEventListener("click", closeForm);
$("#form-close-x").addEventListener("click", closeForm);

function openForm(movie = null) {
  editingId = movie ? movie.id : null;
  formTitle.textContent = movie ? "編輯紀錄" : "新增觀影紀錄";
  titleInput.value = movie ? movie.title : "";
  dateInput.value = movie ? movie.watchDate : new Date().toISOString().slice(0, 10);
  reviewInput.value = movie ? (movie.review || "") : "";
  existingPhotos = movie ? [...(movie.photos || [])] : [];
  pendingPhotos = [];
  deleteBtn.style.display = movie ? "block" : "none";
  renderPhotoRow();
  formModal.classList.add("active");
}
function closeForm() {
  formModal.classList.remove("active");
  pendingPhotos = [];
}

function renderPhotoRow() {
  const existingHtml = existingPhotos.map((url, i) => `
    <div class="photo-thumb"><img src="${url}"><button class="rm" data-existing="${i}">✕</button></div>
  `).join("");
  const pendingHtml = pendingPhotos.map((p, i) => `
    <div class="photo-thumb"><img src="${p.dataUrl}"><button class="rm" data-pending="${i}">✕</button></div>
  `).join("");
  photoRow.innerHTML = existingHtml + pendingHtml + `<button type="button" class="add-photo-btn" id="add-photo-trigger">＋</button>`;

  $("#add-photo-trigger").addEventListener("click", () => fileInput.click());
  photoRow.querySelectorAll("[data-existing]").forEach(b => {
    b.addEventListener("click", () => {
      existingPhotos.splice(Number(b.dataset.existing), 1);
      renderPhotoRow();
    });
  });
  photoRow.querySelectorAll("[data-pending]").forEach(b => {
    b.addEventListener("click", () => {
      pendingPhotos.splice(Number(b.dataset.pending), 1);
      renderPhotoRow();
    });
  });
}

// resize + compress image client-side, output as a base64 data URL
// (stored directly inside the Firestore document, no separate storage bucket needed)
function resizeImageToDataUrl(file, maxEdge = 900, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxEdge || height > maxEdge) {
        if (width > height) { height = Math.round(height * maxEdge / width); width = maxEdge; }
        else { width = Math.round(width * maxEdge / height); height = maxEdge; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = "";
  for (const file of files) {
    try {
      const dataUrl = await resizeImageToDataUrl(file);
      pendingPhotos.push({ dataUrl });
      renderPhotoRow();
    } catch (err) {
      console.error(err);
      showToast("這張照片處理失敗");
    }
  }
});

$("#form-save-btn").addEventListener("click", async () => {
  const title = titleInput.value.trim();
  const watchDate = dateInput.value;
  const review = reviewInput.value.trim();

  if (!title) { showToast("請輸入電影名稱"); return; }
  if (!watchDate) { showToast("請選擇觀看日期"); return; }

  const photos = [...existingPhotos, ...pendingPhotos.map(p => p.dataUrl)];
  // Firestore 單一文件上限 1MB，粗略檢查避免存太多大圖
  const approxSize = JSON.stringify(photos).length;
  if (approxSize > 850000) {
    showToast("照片太多或太大了，請刪掉幾張再試");
    return;
  }

  setLoading(true, "儲存中…");
  try {
    if (editingId) {
      await updateDoc(doc(db, "movies", editingId), { title, watchDate, review, photos });
    } else {
      await addDoc(collection(db, "movies"), {
        title, watchDate, review, photos,
        createdBy: currentUser.uid,
        createdByName: currentUser.displayName || "",
        createdByPhoto: currentUser.photoURL || "",
        createdAt: serverTimestamp()
      });
    }
    setLoading(false);
    closeForm();
    showToast("已儲存！");
  } catch (e) {
    console.error(e);
    setLoading(false);
    showToast("儲存失敗，請確認 Firebase 設定");
  }
});

deleteBtn.addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("確定要刪除這筆觀影紀錄嗎？此動作無法復原。")) return;
  setLoading(true, "刪除中…");
  try {
    await deleteDoc(doc(db, "movies", editingId));
    setLoading(false);
    closeForm();
    closeDetail();
    showToast("已刪除");
  } catch (e) {
    console.error(e);
    setLoading(false);
    showToast("刪除失敗");
  }
});

// ================= DETAIL MODAL =================
const detailModal = $("#detail-modal");
$("#detail-close-x").addEventListener("click", closeDetail);

function openDetail(id) {
  const m = allMovies.find(x => x.id === id);
  if (!m) return;
  const isOwner = currentUser && m.createdBy === currentUser.uid;

  $("#detail-title-text").textContent = m.title;
  $("#detail-date").textContent = formatDate(m.watchDate);
  $("#detail-owner").innerHTML = m.createdByName
    ? `<img src="${m.createdByPhoto || ''}" alt=""> ${escapeHtml(m.createdByName)} 紀錄`
    : "";

  const photosHtml = (m.photos && m.photos.length)
    ? m.photos.map(u => `<img src="${u}" alt="">`).join("")
    : "";
  $("#detail-photos").innerHTML = photosHtml;
  $("#detail-photos").style.display = photosHtml ? "flex" : "none";

  const reviewEl = $("#detail-review");
  if (m.review) {
    reviewEl.textContent = m.review;
    reviewEl.classList.remove("empty");
  } else {
    reviewEl.textContent = "還沒有寫下心得。";
    reviewEl.classList.add("empty");
  }

  $("#detail-edit-btn").style.display = isOwner ? "block" : "none";
  $("#detail-edit-btn").onclick = () => { closeDetail(); openForm(m); };

  detailModal.classList.add("active");
}
function closeDetail() {
  detailModal.classList.remove("active");
}

// ================= UTIL =================
function setLoading(on, msg = "處理中…") {
  loadingOverlay.classList.toggle("active", on);
  $("#loading-text").textContent = msg;
}
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

</script>
</body>
</html>
